name: Build application

on:
  pull_request:
  push:

jobs: 
  build-cli-v1:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/armmbed/mbed-os-env:master-latest

    strategy:
      matrix:
        target: [NUCLEO_F446RE]
        profile: [release, develop]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch Mbed OS and libraries
        run: |
          rm -rf mbed-os mod_rbms_lib
          git clone https://github.com/ARMmbed/mbed-os.git --depth 1 -b mbed-os-6.17.0
          git clone https://github.com/Shaoryu/mod_rbms_lib.git mod_rbms_lib --depth 1 -b unified

      - name: Build application
        run: |
          python3 mbed-os/tools/make.py -t GCC_ARM -m ${{ matrix.target }} --profile ${{ matrix.profile }} --source . --build ./BUILD/${{ matrix.target }}/GCC_ARM-${{ matrix.profile }}
